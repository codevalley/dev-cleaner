# Publish dev-cleaner to npm.
#
# TRIGGER: a pushed version tag, and nothing else. This workflow does not run on pushes to
# a branch, does not run on pull requests, and has no `workflow_dispatch` button — there is
# no way to publish by accident, and a failed run is re-run from the Actions UI rather than
# by adding a manual trigger.
#
# ── AUTHENTICATION: TRUSTED PUBLISHING (OIDC), NOT A TOKEN ────────────────────────────────
#   This workflow holds no npm credential. It authenticates with a short-lived OIDC token
#   minted by GitHub for this specific repository, workflow and run, which npm verifies
#   against a trusted publisher you configure once on the package page.
#
#   That is deliberate and time-sensitive. npm is retiring the long-lived alternative:
#   from early August 2026 a 2FA-bypass token no longer bypasses 2FA for account operations,
#   and from around January 2027 such tokens cannot publish at all — they become read-and-
#   staging only. A publish token committed to a repository secret today is a credential that
#   stops working, can be stolen while it does, and never expires on its own.
#   https://github.blog/changelog/2026-07-08-npm-install-time-security-and-gat-bypass2fa-deprecation/
#
#   ONE-TIME SETUP, after 0.1.0 exists on the registry:
#     npmjs.com → dev-cleaner → Settings → Trusted publishers → GitHub Actions
#       Organization or user:  codevalley
#       Repository:            dev-cleaner
#       Workflow filename:     publish.yml
#     No secret is created, and nothing needs to be rotated afterwards.
#
#   The first publish cannot use this: a trusted publisher is configured ON a package, so the
#   package has to exist. Publish 0.1.0 once from a laptop with `npm login` and 2FA, then
#   configure the above and every release after it is hands-off.
#
#   REQUIREMENTS, all satisfied below: npm CLI >= 11.5.1, Node >= 22.14.0, `id-token: write`,
#   and `registry-url` set on setup-node.
#
# ── PROVENANCE ────────────────────────────────────────────────────────────────────────────
#   Automatic. Publishing from a public repository to a public package under trusted
#   publishing attaches the signed statement linking tarball to repo, commit and run without
#   the `--provenance` flag — which is why the flag is gone. Passing it is not merely
#   redundant, it fails a laptop publish that has no OIDC to attest with.

name: Publish

on:
  push:
    tags:
      # v1.2.3 and v1.2.3-rc.1. A tag that is not a version does not publish.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm
    # macOS because that is the platform the whole test suite is known to pass on; the
    # suite runs here as the last gate before anything is published.
    runs-on: macos-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write # mints the OIDC token trusted publishing exchanges

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # >= 22.14.0 and npm >= 11.5.1 are trusted publishing's floor. Pinned to 24 rather
          # than tracking '22' so the floor cannot drift underneath us on a runner refresh.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # The npm bundled with a Node release is often older than the floor. Cheap to be sure.
      - name: Ensure an npm that can use trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # Same reasoning as ci.yml: the fixtures set their own identity, this is the belt to
      # that pair of braces.
      - name: Configure git identity for the fixtures
        run: |
          git config --global user.name 'dev-cleaner CI'
          git config --global user.email 'ci@dev-cleaner.invalid'
          git config --global init.defaultBranch main
          git config --global commit.gpgsign false

      - name: Install
        run: npm ci

      - name: Typecheck (src + tests)
        run: npx tsc -p tsconfig.test.json

      - name: Build
        run: npm run build

      - name: Smoke-test the built binary
        run: node dist/cli.js --help

      # A red suite means no publish. This tool deletes user data; the gate is not optional.
      - name: Test
        run: npm test

      # Fail closed on a mistyped tag: v0.2.0 must not publish a package.json that still
      # says 0.1.0. TAG_NAME goes through the environment rather than being interpolated
      # into the script, so a tag name can never be shell.
      - name: Refuse to publish unless the tag matches package.json
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          tagged="${TAG_NAME#v}"
          declared="$(node -p 'require("./package.json").version')"
          if [ "$tagged" != "$declared" ]; then
            echo "tag is v$tagged but package.json declares $declared — refusing to publish" >&2
            exit 1
          fi
          echo "tag v$tagged matches package.json $declared"

      # `npm publish` runs the `prepack` script, which rebuilds dist from source, so the
      # tarball is compiled from the tagged commit rather than from whatever happens to be
      # sitting in the working directory.
      # No NODE_AUTH_TOKEN: the OIDC token is minted from `id-token: write` above and
      # exchanged by npm itself. Provenance is attached automatically.
      - name: Publish
        run: npm publish --access public
